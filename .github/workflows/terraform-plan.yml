name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/environments/**"
      - "infra/modules/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write       # OIDC token for AWS
  contents: read
  pull-requests: write  # plan comment

jobs:
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # prod uses the reviewer-free "prod-plan" GitHub Environment so PRs never wait
          - { environment: homol, gh_environment: homol }
          # - { environment: prod, gh_environment: prod-plan }  # enable when prod exists (Phase 7)
    environment: ${{ matrix.gh_environment }}
    concurrency:
      group: terraform-plan-${{ matrix.environment }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.environment }}
    env:
      TF_VAR_databricks_account_id: ${{ secrets.TF_VAR_databricks_account_id }}
      TF_VAR_databricks_client_id: ${{ secrets.TF_VAR_databricks_client_id }}
      TF_VAR_databricks_client_secret: ${{ secrets.TF_VAR_databricks_client_secret }}
      TF_VAR_admin_user_email: ${{ secrets.TF_VAR_admin_user_email }}
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive ../..

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate -no-color

      - name: plan
        id: plan
        # -lock=false: a PR plan must never hold the state lock that a merge apply needs
        run: |
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.txt
          # 0 = no changes, 2 = changes; only 1 is an error
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          WORKDIR: infra/environments/${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(`${process.env.WORKDIR}/plan.txt`, 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (truncated, see job log)';
            const marker = `<!-- terraform-plan-${process.env.ENVIRONMENT} -->`;
            const body = `${marker}\n### Terraform plan: \`${process.env.ENVIRONMENT}\` (${{ steps.plan.outcome }})\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }